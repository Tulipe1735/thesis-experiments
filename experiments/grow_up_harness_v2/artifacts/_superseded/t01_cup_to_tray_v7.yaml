schema_version: artifact.v1
id: t01_cup_to_tray
version: 7
kind: skill
provenance:
  form: engineering_composition
  author: engineering distillation of the S1C0 agent episodes
  first_run: experiments/grow_up_harness_v2/runs/t01_artifact_v7_20261106_001
  note: 'v7 continues the v6 bounded repair. Diagnosis on development case position_310102:
    after a successful grasp and a 12.2 cm lift, the open-loop carry points ran one
    step ahead of the arm (6.8 cm at the final point) and the 5 cm guard rejected
    the move. The arm tracked its joint targets within about 1 cm, so this is command-cursor
    accumulation, not unreachable geometry. v7 executes raise_clear, the move above
    the tray and descend_to_lower as one move_linear each, which interpolates from
    the actual palm. Targets, yaw, phases, closure, thresholds and the independent
    evaluator are unchanged.'
scope:
  task: T01
  assets:
  - DH_2F_mug_06
  - rectangular_low_rim_v1
  stage: single_room_tabletop
  initial_states:
  - path: experiments/t0_agent_v1/tray_astra_20261025_002/episodes/2500_T01_astra/initial_state.npz
    sha256: 6b9e061e1f20757cbeed66cd4bffbf0d1f5b2ec5ae928b01a2c748b445f18941
contract:
  preconditions:
  - target_visible
  - hand_empty
  - tray_visible
  - guard_clear
  postconditions:
  - cup_base_inside_tray_support_region
  - tray_floor_support_ge_0.5N
  - cup_released_hand_contact_lt_0.1N
  - cup_upright_and_stable_ge_1s
  failure_exits:
  - code: GRASP_UNREACHABLE
    condition: no candidate (waist, yaw) passes the dry-run IK check
    recovery: report the failure; the cup is outside the arm envelope at every tried
      waist
  - code: RELEASE_TOO_HIGH
    condition: the hand opens while the palm is above tray floor + 0.12 m
    recovery: lower in <=5 cm steps, then open
  - code: REAPPROACH_AFTER_RELEASE
    condition: the hand closes or the palm drops below tray floor + 0.10 m after release
    recovery: retreat and finish
  - code: MOVE_TOO_LONG
    condition: one plain move exceeds 0.05 m of palm travel
    recovery: split the move
assumptions:
  max_single_move_m: 0.05
  release_height_m: 0.03
  placement_tolerance_m: 0.013
  contact_load_max_N: 0.1
  notes:
  - tray inner half-extent [0.214, 0.054] m with cup radius 0.041 m gives a +/-0.013
    m band in y
  - the lean to waist pitch -0.10 rad is required for the approach path to stay reachable
binding:
  plant_sha256: e86012f1605c84e31f29102b04754de76a5be01354acb274c6029db6c334d7c6
  evaluator_sha256: b94d53c5651ad4c2c415f0dab578d950e2c3a04dcc883ee8181b4358bafa5fd7
  simulation_budget_s: 180.0
interfaces:
  observations:
  - cup_bottoms_m
  - tray_floor_center_m
  - left_palm
  - grasp_probe
  commands:
  - move
  - joints
  - wait
  - finish
  guards:
  - MAX_MOVE_M
  - RELEASE_TOO_HIGH
  - REAPPROACH_AFTER_RELEASE
ir:
  budget_s: 180.0
  parameters:
    step_m: 0.035
    retreat_m: 0.045
    vertical_clear_m: 0.12
    place_above_m: 0.13
    place_lower_m: 0.03
    hold_before_open_s: 1.5
    settle_after_open_s: 1.5
    correction_step_m: 0.04
    correction_tolerance_m: 0.004
    approach_seconds: 2.0
    retreat_seconds: 2.0
  close_angles:
    left_hand_thumb_0_joint: 0.0
    left_hand_thumb_1_joint: 0.65
    left_hand_thumb_2_joint: 0.65
    left_hand_middle_0_joint: -0.8
    left_hand_middle_1_joint: -0.6
    left_hand_index_0_joint: -0.8
    left_hand_index_1_joint: -0.6
  phases:
    plan:
    - op: walk_to
      to:
        literal:
        - -0.07
        - 0.34
        - 0.09
      yaw:
        literal: 0.0
      orientation: keep
    - op: walk_to
      to:
        literal:
        - -0.04
        - 0.34
        - 0.3
      yaw:
        grasp: true
      orientation: yaw
    - op: joints
      targets:
        waist_pitch_joint:
          grasp_waist: true
      seconds: 1.0
    - op: wait
      seconds: 1.0
    - op: line_to
      to:
        literal:
        - -0.04
        - 0.34
        - 0.3
      yaw:
        grasp: true
      orientation: yaw
      seconds: 2.0
    - op: line_to
      to:
        observed: grasp.approach_start
      yaw:
        grasp: true
      orientation: yaw
      seconds: 2.0
    - op: line_to
      to:
        observed: grasp.xyz
      yaw:
        grasp: true
      orientation: yaw
      seconds: 2.0
    - op: close_hand
      seconds: 2.0
    - op: wait
      seconds: 0.5
    lift:
    - op: raise_clear
      clearance_m:
        param: vertical_clear_m
      yaw:
        grasp: true
      execution: linear
    - op: walk_to
      to:
        place: above
      yaw:
        grasp: true
      orientation: keep
      execution: linear
    correct:
    - op: recenter_cup
      tolerance_m:
        param: correction_tolerance_m
      step_m:
        param: correction_step_m
    release:
    - op: descend_to_lower
      height_m:
        param: place_lower_m
      yaw:
        grasp: true
      execution: linear
    - op: wait
      seconds:
        param: hold_before_open_s
    - op: open_hand
      seconds: 2.0
    - op: wait
      seconds:
        param: settle_after_open_s
    - op: retreat_up
      distance_m:
        param: retreat_m
      steps: 2
      yaw:
        grasp: true
    - op: wait
      seconds: 1.2
    - op: finish
evidence: {}
