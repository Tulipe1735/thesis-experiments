summary: 'Three-cup collection: keep the recorded place/retreat leaves, but replace
  the cup-1 retreat with a proprioceptive Cartesian retreat that lifts the palm ~10
  cm straight up out of the tray before any horizontal motion, then settles exactly
  onto the recorded cup-1 retreat end pose; cups 2 and 3 keep their recorded (contact-free)
  retreats, and the last recorded retreat supplies the >=1 s joint hold.'
