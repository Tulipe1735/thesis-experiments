  note: 'Diagnosis: the only defective event was the start of t02_cup1_retreat, where
    the index/middle finger links swept +y at cup height and pushed the just-released
    cup 6-8 mm, pushing it to/over the 1 mm footprint margin; 25 other placements
    moved <=0.3 mm, i.e. no contact. Fix targets only that: the new leaf reconstructs
    the palm pose from the given pelvis kinematic chain (verified: FK reproduces the
    observed left_palm to <0.1 mm at the initial pose), lifts the palm vertically
    with a damped-least-squares Jacobian IK on the 4 proximal arm joints (<=0.028
    rad per 0.15 s command, well inside the 0.03 / 0.30 rate bound, <=0.03 m Cartesian
    per command), translates back over the body at that height, and finally snaps
    the 7 arm joints onto the recorded t02_cup1_retreat end pose, so t02_cup2_place
    starts from exactly the same configuration as in the recorded sequence. No cup/tray
    estimate is required at run time, only joint targets. New leaves enter the library
    only if the whole composite passes.'
