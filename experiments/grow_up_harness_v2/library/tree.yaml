    family: T03
    root: t03_orange_to_platter_temporal_locate
    runtime_interface: T03 init/act immutable component-ID plan; registered t03_finish
      runtime calls recipe, placement, finish at real physical boundaries. No controller
      resynthesis. The optional locate_ref selects a residual band only on primary
      sphere-confidence failure. Version t03-temporal-rgbd-consensus-v2 may initialize
      from prior RGB-D only with fresh majority evidence.
    evaluator: t03-fruit-bottom-v2-20261111
    components:
      grasp_ref: t03_adaptive_recipe
      placement_ref: t03_placement_target
      finish_ref: t03_post_release_finish
      open_ref: hand_open
      locate_ref: t03_locate_residual_consensus
      locate_runtime: t03-temporal-rgbd-consensus-v2
  t03_route:
    family: T03
    root: t03_orange_to_platter_observed_can
    runtime_interface: T03 fixed component-ID root + optional approach_ref selects
      only prechecked default/top_down/null at ready preflight; observed gray can,
      original grasp endpoint/yaw unchanged; runtime t03-rgbd-can-approach-v1
    evaluator: t03-fruit-bottom-v2-20261111
    components:
      grasp_ref: t03_adaptive_recipe
      placement_ref: t03_placement_target
      finish_ref: t03_post_release_finish
      open_ref: hand_open
      locate_ref: t03_locate_residual_consensus
      locate_runtime: t03-temporal-rgbd-consensus-v2
      approach_ref: t03_observed_can_route
      approach_runtime: t03-rgbd-can-approach-v1
  t03_pose:
    family: T03
    root: t03_orange_to_platter_local_pose
    runtime_interface: T03 immutable component IDs + observed_can_pose selection over
      finite RGB-D-relative native XY offsets and top_down; runtime t03-rgbd-can-local-offset-v2
    evaluator: t03-fruit-bottom-v2-20261111
    components:
